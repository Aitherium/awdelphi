[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "awdelphi"
version = "0.1.0"
description = "Aither World Delphi — anonymous multi-round expert panels that converge to a decision with a trace, or honestly report no consensus."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21.0"]

# `awdelphi mcp` — serve panels to any MCP coding agent over stdio.
# Pinned to 2.x for the same reason awrelay pins it: the 1.x server API was
# REMOVED in 2.0, and a version written for one raises AttributeError on the
# other despite `mcp>=1.0` letting pip resolve 2.0 anyway.
mcp = ["mcp>=2.0"]

[project.scripts]
awdelphi = "awdelphi.cli:main"

[project.urls]
Homepage = "https://github.com/Aitherium/awdelphi"
Documentation = "https://github.com/Aitherium/awdelphi#readme"
Repository = "https://github.com/Aitherium/awdelphi.git"
Issues = "https://github.com/Aitherium/awdelphi/issues"

[tool.setuptools]
packages = ["awdelphi"]
license-files = ["LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
